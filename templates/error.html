{% extends "base.html" %}

{% block title %}{{ title or "Notice" }} — Hydria{% endblock %}

{% block content %}
<div class="auth-wrapper" style="text-align: center; margin: 4rem auto; max-width: 500px;">
    <div class="card" style="padding: 2.5rem 1.5rem;">
        <div style="margin-bottom: 1rem; color: var(--primary);">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
            </svg>
        </div>
        <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--text-primary); margin-bottom: 0.5rem;">
            {{ title or "Something went wrong" }}
        </h1>
        <p style="font-size: 0.98rem; color: var(--text-secondary); line-height: 1.6; margin-bottom: 1.75rem;">
            {{ message or "Please try again in a moment." }}
        </p>
        <div style="display: flex; justify-content: center; gap: 0.75rem;">
            <a href="javascript:history.back()" class="btn btn-secondary">
                &larr; Go Back
            </a>
            <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
                Return to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
