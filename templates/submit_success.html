{% extends "base.html" %}

{% block title %}Report Submitted — Hydria{% endblock %}

{% block content %}
<div class="auth-wrapper" style="max-width: 540px; text-align: center; margin: 3.5rem auto;">
    <div class="card" style="padding: 3rem 2rem; border-top: 5px solid var(--accent);">
        <div style="font-size: 3.5rem; margin-bottom: 1rem;">✓</div>
        
        <h1 style="font-size: 2rem; font-weight: 800; color: #065f46; margin-bottom: 0.75rem;">
            Report Submitted
        </h1>
        
        <p style="font-size: 1.1rem; color: var(--text-secondary); line-height: 1.6; margin-bottom: 2rem;">
            Thank you for helping your community understand local freshwater ecosystems.
        </p>

        <div style="display: flex; flex-direction: column; gap: 0.85rem; max-width: 320px; margin: 0 auto;">
            <a href="{{ url_for('report_detail', report_id=report_id) }}" class="btn btn-primary btn-large" id="btn-view-report">
                View Report
            </a>
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary" id="btn-back-home">
                Back to Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
